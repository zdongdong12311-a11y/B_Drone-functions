# ============================================================
# 双相机配置: 朝前 + 朝下 同时工作
# 启动: roslaunch yolo_to_movebase yolo_to_movebase.launch camera:=dual
# ============================================================

world_frame: "world"
use_full_attitude: true
publish_delay: 8.0
tf_rate: 10.0

class_names:
  0: "person"
  1: "car"

cameras: ["front", "down"]

front:
  topic: "/yolo_msgs_front"
  fx: 1000.0                        # TODO: 标定值
  fy: 1000.0
  cx: 640.0
  cy: 360.0
  mount_rpy_deg: [0.0, 0.0, 0.0]
  mount_xyz: [0.05, 0.0, -0.05]
  depth_mode: "distance"
  real_sizes:
    person: 1.7
    car: 1.5
  min_score: 0.5
  min_range: 0.5
  max_range: 30.0
  x_offset: 0.1
  z_offset: 1.3

down:
  topic: "/yolo_msgs_down"
  fx: 1000.0                        # TODO: 标定值
  fy: 1000.0
  cx: 640.0
  cy: 360.0
  mount_rpy_deg: [0.0, 90.0, 0.0]
  mount_xyz: [0.0, 0.0, -0.05]
  depth_mode: "ground"
  ground_z: 0.0
  min_score: 0.5
  min_range: 0.5
  max_range: 15.0
  max_tilt_deg: 15.0
  x_offset: 0.0
  z_offset: 0.5